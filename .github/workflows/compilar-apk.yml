name: Compilar APK de Lupa Flotante

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: LupaFlotante-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
