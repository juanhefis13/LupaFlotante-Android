name: Diagnosticar instalacion del APK en Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-instalacion.yml'
      - 'scripts/verificar-apk-emulador.sh'

jobs:
  instalar-y-abrir:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    permissions:
      contents: read
    steps:
      - name: Descargar archivos de test
        uses: actions/checkout@v4
      - name: Descargar el APK exacto publicado
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o app-a-probar.apk 'https://github.com/juanhefis13/LupaFlotante-Android/releases/download/v1.2/LupaFlotante-Release-v1.2.apk'
          echo '99570eca886d5da1025d9fcaae7ecfac500e1984e82c6bdf58897ceb4c4ad406  app-a-probar.apk' | sha256sum -c -
          unzip -t app-a-probar.apk | tail -2
      - name: Permitir KVM para emulador
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y abrir la APK publicada en Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          script: bash scripts/verificar-apk-emulador.sh app-a-probar.apk

      - name: Adjuntar captura de la aplicacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pantalla-Lupa-Flotante-API-${{ matrix.api-level }}
          path: capturas/*.png
          if-no-files-found: ignore
